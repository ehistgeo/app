<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>e-histgeo</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e7f0fb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="e-histgeo">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <img src="e-histgeo logo.png" alt="e-histgeo" class="logo">
            <p>Bienvenue sur l'app e-histgeo</p>
            <p>Vous retrouverez ici tous les liens utiles pour suivre le cours</p>
        </header>

        <!-- Mes cours -->
        <h2 class="group-title">Vos cours</h2>

        <!-- Classes Grid -->
        <section class="section section-classes">
            <div class="grid">
                <a href="https://edurl.fr/ON2GT" class="button button-class" target="_blank">
                    2GT
                </a>
                <a href="https://edurl.fr/ON1STMG" class="button button-class" target="_blank">
                    1STMG
                </a>
                <a href="http://edurl.fr/ON1HGGSP" class="button button-class" target="_blank">
                    1SPE HGGSP
                </a>
                <a href="http://edurl.fr/ONTHGGSP" class="button button-class" target="_blank">
                    TSPE HGGSP
                </a>
            </div>
        </section>

        <!-- Vos ressources -->
        <h2 class="group-title">Vos ressources</h2>

        <!-- ENT Button -->
        <section class="section">
            <a href="https://psn.monlycee.net" class="button button-link" target="_blank">
                ENT
            </a>
        </section>

        <!-- Petites tuiles de ressources -->
        <section class="section">
            <div class="grid grid-small">
                <!-- http : le certificat https de ce domaine ne correspond pas au nom de domaine -->
                <a href="http://cdg-longperrier.fr" class="button button-small" target="_blank" rel="noopener">
                    Lycée
                </a>
                <a href="https://www.pearltrees.com/private/id104592773?access=47df8840014.63bf585.4e6aac77190f5994214486dadbbf9be3" class="button button-small" target="_blank" rel="noopener">
                    Pearltrees
                </a>
                <a href="https://reactiv.dane.ac-versailles.fr" class="button button-small" target="_blank" rel="noopener">
                    Réactiv'
                </a>
                <a href="https://youtube.com/playlist?list=PLZmuf2KsdD-c&amp;si=917XmsMGsE5s0ZmF" class="button button-small" target="_blank" rel="noopener">
                    À voir
                </a>
                <!-- TODO : deux liens à renseigner -->
                <span class="button button-small button-empty" title="Lien à venir">?</span>
                <span class="button button-small button-empty" title="Lien à venir">?</span>
            </div>
        </section>

        <!-- Mentions -->
        <footer class="footer">
            <p>e-histgeo, site pédagogique de M. PLANCHOT-GEFFARD. Tous droits réservés.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
